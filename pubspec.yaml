name: evcs
description: A new Flutter project.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  animations: ^2.0.8
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.2
  dio: ^5.3.3
  equatable: ^2.0.5
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.1
  flutter:
    sdk: flutter
  flutter_advanced_drawer: ^1.3.5
  flutter_bloc: ^8.1.3
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.7
  geolocator: ^13.0.1
  get: ^4.6.6
  get_it: ^7.6.4
  get_storage: ^2.1.1
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.5.0
  internet_connection_checker: ^1.0.0+1
  intl: ^0.19.0
  introduction_screen: ^3.1.12
  logger: ^2.0.2+1
  lottie: ^3.1.2
  package_info_plus: ^8.0.2
  rxdart: ^0.28.0
  shimmer: ^3.0.0
  freezed: 2.5.2
  freezed_annotation: ^2.4.1
  flutter_dotenv: ^5.1.0
  awesome_dio_interceptor: ^1.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_gen: ^5.5.0+1
  build_runner:
  flutter_gen_runner:
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/gifs/
    - .env

flutter_gen:
  output: lib/core/assets/
  integrations:
    flutter_svg: true
    lottie: true

